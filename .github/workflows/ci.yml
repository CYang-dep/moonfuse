name: MoonFuse CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        uses: moonbitlang/setup-moonbit@v1
      - name: Check and test
        run: |
          moon check
          moon test
          moon info
          moon fmt --check
